name: Render match report

on:
  push:
    branches: [match-report]
    paths: ["match-report/**"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: render
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq fonts-roboto fonts-paratype || true
          fc-list | grep -i "pt sans" | head -2 || true
          if ! fc-list | grep -qi "pt sans"; then
            mkdir -p ~/.fonts
            for f in Regular Bold; do curl -sSL -o ~/.fonts/PT_Sans-$f.ttf "https://github.com/google/fonts/raw/main/ofl/ptsans/PT_Sans-Web-$f.ttf"; done
            fc-cache -f
          fi
          pip install numpy pandas matplotlib mplsoccer statsbombpy
          python -c "import matplotlib.font_manager as fm; fm._load_fontmanager(try_read_cache=False)"
      - name: Build xT grid if missing
        working-directory: match-report
        env:
          MPLBACKEND: Agg
        run: test -f xt16.npy || python build_xt_grid.py
      - name: Render
        env:
          MPLBACKEND: Agg
        working-directory: match-report
        run: |
          mkdir -p ../renders
          python - <<'PY'
          from match_report import match_report
          match_report(18235, "Inter Milan", "Bayern Munich",
                       subtitle="Champions League final, 22 May 2010",
                       save_as="../renders/inter_bayern.png")
          match_report(18236, "Barcelona", "Manchester United",
                       left_color="#235C53", right_color="#D1A044",
                       subtitle="Champions League final, 27 May 2009",
                       save_as="../renders/barca_manutd.png")
          PY
      - name: Commit render
        run: |
          git config user.name "render-bot"
          git config user.email "render-bot@users.noreply.github.com"
          git add renders match-report/xt16.npy
          git diff --cached --quiet || git commit -m "Render [skip ci]"
          git push
